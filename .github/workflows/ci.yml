name: Backend CI

# Scope note: this repo (AgenticApp) holds the backend only -- the frontend
# lives in a separate repo/remote (AgenticApp-frontend) and needs its own
# workflow there. This workflow catches what's cheap and real today: Python
# syntax errors across the whole backend, a broken docker-compose.yml/
# Dockerfile, and the one real pytest module that exists so far (see
# backend/tests/ -- backend/mcp_servers/client/test_*.py are separate
# ad-hoc/print-based scripts, not pytest-discoverable, and not run here).
# backend/tests also covers the API's multi-user access-control rules
# (test_api_access_control.py, MCP/LLM faked in-process) and, against a real
# pgvector Postgres service, the stores, vector search and per-user DB
# workspaces.

on:
  push:
    branches: [master]
  pull_request:

jobs:
  python-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Byte-compile every backend module (catches syntax errors)
        run: python -m compileall -q backend

  pytest:
    runs-on: ubuntu-latest
    services:
      # Real Postgres + pgvector for the integration tests (stores, vector
      # search, per-user DB workspaces) — see backend/tests/conftest.py.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        # backend/requirements-test.txt is the API's import surface only
        # (fastapi, fastmcp, openai, motor, ...) -- not the heavy indexing/
        # retrieval stack (docling, torch, langchain), which no test needs.
        run: pip install -r backend/requirements-test.txt
      - name: Run backend/tests
        run: python -m pytest backend/tests

  sandbox-isolation:
    # The code sandbox's uid isolation needs root (as in its container), so
    # these tests run under sudo; everywhere else they're skipped.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies (+ pandas for the spreadsheet tests)
        run: pip install -r backend/requirements-test.txt pandas openpyxl
      - name: Run sandbox tests as root
        run: sudo -E env "PATH=$PATH" python -m pytest backend/tests/test_code_sandbox.py -v

  sandbox-image:
    # Build the real code-sandbox image and run it the way docker-compose.yml
    # does (read-only, minimal capabilities, internal network), then check
    # from inside that submitted code is unprivileged, can't read the
    # server's environment, has no internet and can't write the filesystem.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t agenticapp-code-sandbox -f docker/sandbox/Dockerfile .
      - name: Start it like compose does
        run: |
          docker network create --internal sandbox-ci
          docker run -d --name sandbox --network sandbox-ci --init --read-only \
            --tmpfs /work:size=1g,mode=0711 --tmpfs /tmp:size=256m \
            --cap-drop ALL --cap-add SETUID --cap-add SETGID --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add KILL \
            --security-opt no-new-privileges:true --memory 2g --pids-limit 256 \
            agenticapp-code-sandbox
          for i in $(seq 1 30); do
            docker exec sandbox python -c "import socket; socket.create_connection(('127.0.0.1', 8003), 1)" 2>/dev/null && break
            sleep 1
          done
      - name: Smoke test
        run: docker exec -i sandbox python - < docker/sandbox/smoke_test.py
      - name: Server logs
        if: always()
        run: docker logs sandbox

  docker-compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stand in for the real (gitignored) backend/.env
        # docker-compose.yml's `app` service declares `env_file: backend/.env`,
        # which is never committed (.gitignore:2) and so doesn't exist on this
        # runner -- `docker compose config` hard-fails just resolving that
        # reference, before it even gets to checking syntax. The actual
        # values don't matter here: this job only validates that the compose
        # file itself parses and resolves, never builds or runs anything.
        run: cp backend/.env.example backend/.env
      - name: Validate docker-compose.yml resolves and parses (every profile)
        run: |
          docker compose config -q
          docker compose --profile edge config -q
          FRONTEND_DIR=. docker compose --profile tunnel config -q
      - name: Validate the Caddyfile
        run: docker run --rm -v "$PWD/docker/web/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
