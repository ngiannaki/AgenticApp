name: Backend CI

# Scope note: this repo (AgenticApp) holds the backend only -- the frontend
# lives in a separate repo/remote (AgenticApp-frontend) and needs its own
# workflow there. This workflow catches what's cheap and real today: Python
# syntax errors across the whole backend, a broken docker-compose.yml/
# Dockerfile, and the one real pytest module that exists so far (see
# backend/tests/ -- backend/mcp_servers/client/test_*.py are separate
# ad-hoc/print-based scripts, not pytest-discoverable, and not run here).
# backend/tests also covers the API's multi-user access-control rules
# (test_api_access_control.py, MCP/LLM faked in-process) and, against a real
# pgvector Postgres service, the stores, vector search and per-user DB
# workspaces.

on:
  push:
    branches: [master]
  pull_request:

jobs:
  python-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Byte-compile every backend module (catches syntax errors)
        run: python -m compileall -q backend

  pytest:
    runs-on: ubuntu-latest
    services:
      # Real Postgres + pgvector for the integration tests (stores, vector
      # search, per-user DB workspaces) — see backend/tests/conftest.py.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        # backend/requirements-test.txt is the API's import surface only
        # (fastapi, fastmcp, openai, motor, ...) -- not the heavy indexing/
        # retrieval stack (docling, torch, langchain), which no test needs.
        run: pip install -r backend/requirements-test.txt
      - name: Run backend/tests
        run: python -m pytest backend/tests

  docker-compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stand in for the real (gitignored) backend/.env
        # docker-compose.yml's `app` service declares `env_file: backend/.env`,
        # which is never committed (.gitignore:2) and so doesn't exist on this
        # runner -- `docker compose config` hard-fails just resolving that
        # reference, before it even gets to checking syntax. The actual
        # values don't matter here: this job only validates that the compose
        # file itself parses and resolves, never builds or runs anything.
        run: cp backend/.env.example backend/.env
      - name: Validate docker-compose.yml resolves and parses
        run: docker compose config
