worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # --- Upstreams: your two local MCP servers ---

    upstream api_server {
        server 127.0.0.1:8100;
    }

    server {
        listen 8080;
        server_name localhost;

        # MCP servers commonly use SSE / streamable HTTP, so we disable
        # buffering and allow long-lived connections + upgrades.

        # --- Indexing MCP server ---

        # --- Retrieval MCP server ---

        # --- Agentic App API (FastAPI, SSE) ---
        location /api/ {
            proxy_pass http://api_server/api/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # SSE: no buffering, no caching, keep long-lived streams open.
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            chunked_transfer_encoding off;
        }

        location / {
            return 404;
        }
    }
}
