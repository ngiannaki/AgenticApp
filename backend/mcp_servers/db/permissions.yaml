# Authorization for the Database MCP server.
#
# Every user works in their own private Postgres schema (`ws_<hash>`, see
# database/workspace.py) — they can only ever see and change tables they (or
# the assistant on their behalf) created. So within that workspace the
# default below allows everything; the safety net for writes is that the API
# always pauses insert/update/delete/create/alter tool calls for the user's
# approval (API_MANDATORY_APPROVAL_TOOLS).
#
# See permissions.example.yaml for the full format (per-table overrides,
# deny_columns, protected_tables).

default:
  select: true
  insert: true
  update: true
  delete: true
  schema_change: true
