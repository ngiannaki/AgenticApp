# Local/single-host way to run the whole stack with one command:
#   docker compose up --build
#
# This is the Docker alternative to start_mcp_servers.ps1 — see RUNNING.md
# for how the two compare. It reuses backend/.env for every setting (API
# keys, model names, feature flags, ...) except the database URLs, which must
# point at this compose network's `postgres` service instead of localhost and
# are overridden below.
#
# One database: Postgres with pgvector holds users, chats, the document
# registry, the vector index and each user's private DB-tool tables.
# Passwords come from the root .env (POSTGRES_PASSWORD, AGENT_DB_PASSWORD) —
# the defaults below are for local use only.
services:
  app:
    build: .
    ports:
      - "8100:8100"
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql://raguser:${POSTGRES_PASSWORD:-changeme}@postgres:5432/ragdb
      DATABASE_AGENT_ROLE_PASSWORD: ${AGENT_DB_PASSWORD:-changeme-agent}
      DB_MCP_DATABASE_URL: postgresql://agent_ws:${AGENT_DB_PASSWORD:-changeme-agent}@postgres:5432/ragdb
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      # Bind-mounts the actual source over the image's baked-in COPY, so
      # edits on the host are visible inside the container immediately —
      # no rebuild needed. No auto-reload though: run
      # `docker compose restart app` yourself when you want the running
      # process to pick up the new code. The Dockerfile's CMD (used for
      # real deploys, not this compose file) is untouched and still bakes
      # the code in instead.
      - ./backend:/app/backend

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ragdb
    # Host access for local tools (psql, a DB GUI) only — bound to localhost.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - agenticapp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raguser -d ragdb"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  agenticapp_pgdata:
