# The whole app with one command (see RUNNING.md, and DEPLOY.md for a server):
#
#   docker compose up --build                      # local: API on http://localhost:8100
#   docker compose --profile edge up --build -d    # + Caddy serving the frontend and /api (HTTPS with a domain)
#   docker compose --profile tunnel up --build -d  # + a named Cloudflare tunnel (your PC, no open ports)
#
# Every service reads backend/.env (API keys, models, secrets). Shared
# secrets come from there too: MCP_INTERNAL_TOKEN (API <-> MCP servers),
# AGENTS_INTERNAL_TOKEN (API <-> agents). Database passwords come from a root
# .env (POSTGRES_PASSWORD, AGENT_DB_PASSWORD); the defaults are for local use.
#
# Topology: each MCP server is its own HTTP service (same image as the API),
# reachable only inside the compose network and only with the internal token.
# The code sandbox sits on an internal network with the API alone (no
# internet, no Postgres). Postgres and the API are published on 127.0.0.1
# only; the edge/tunnel profiles are the only way in from outside.

x-backend: &backend
  # One image for the API, the MCP servers and the agents (built once, cached).
  image: agenticapp-backend
  build: .
  env_file:
    - backend/.env
  restart: unless-stopped
  volumes:
    - ./data:/app/data
    - ./logs:/app/logs

x-db-env: &db-env
  DATABASE_URL: postgresql://raguser:${POSTGRES_PASSWORD:-changeme}@postgres:5432/ragdb
  DATABASE_AGENT_ROLE_PASSWORD: ${AGENT_DB_PASSWORD:-changeme-agent}
  DB_MCP_DATABASE_URL: postgresql://agent_ws:${AGENT_DB_PASSWORD:-changeme-agent}@postgres:5432/ragdb

services:
  app:
    <<: *backend
    environment:
      <<: *db-env
      API_SERVERS_PATH: /app/backend/apps/client/servers.compose.json
      AGENTS_URL: http://agents:9100
    ports:
      - "127.0.0.1:8100:8100"
    depends_on:
      db-setup:
        condition: service_completed_successfully
      indexing:
        condition: service_healthy
      retrieval:
        condition: service_healthy
      db:
        condition: service_healthy
      code-sandbox:
        condition: service_started
    networks: [default, sandbox]
    # Probes MCP + Postgres (503 when either is down).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

  # Migrations + the DB tool's restricted role, once, before anything else.
  db-setup:
    <<: *backend
    restart: "no"
    command: ["python", "-m", "backend.scripts.db_setup"]
    environment:
      <<: *db-env
    depends_on:
      postgres:
        condition: service_healthy

  indexing:
    <<: *backend
    command: ["python", "-m", "backend.mcp_servers.indexing.server"]
    environment:
      <<: *db-env
      MCP_TRANSPORT: http
      INDEXING_MCP_HOST: 0.0.0.0
    depends_on:
      db-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2)"]
      interval: 3s
      timeout: 3s
      retries: 40

  retrieval:
    <<: *backend
    command: ["python", "-m", "backend.mcp_servers.retrieval.server"]
    environment:
      <<: *db-env
      MCP_TRANSPORT: http
      RETRIEVAL_MCP_HOST: 0.0.0.0
    depends_on:
      db-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8001), 2)"]
      interval: 3s
      timeout: 3s
      retries: 40

  db:
    <<: *backend
    command: ["python", "-m", "backend.mcp_servers.db.server"]
    environment:
      <<: *db-env
      MCP_TRANSPORT: http
      DB_MCP_HOST: 0.0.0.0
    depends_on:
      db-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8002), 2)"]
      interval: 3s
      timeout: 3s
      retries: 40

  # The A2A agents (Deep Research, Data Analyst, Extractor, ...). Tools only
  # through the API (/internal/tools) with AGENTS_INTERNAL_TOKEN.
  agents:
    <<: *backend
    command: ["python", "-m", "backend.apps.agents.main"]
    environment:
      AGENTS_HOST: 0.0.0.0
      AGENTS_URL: http://agents:9100
      AGENTS_API_URL: http://app:8100

  # Runs the code the assistant writes (run_python_code, spreadsheet
  # analysis). Locked down: no app secrets except the internal token (only
  # its root server process can read it), read-only filesystem, minimal
  # capabilities, resource limits, and on the `sandbox` network only — it
  # can reach the API (one-time file tokens) but not Postgres or the
  # internet. Each submission runs as its own unprivileged uid inside.
  code-sandbox:
    build:
      context: .
      dockerfile: docker/sandbox/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /work:size=1g,mode=0711
      - /tmp:size=256m
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE, KILL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    pids_limit: 256
    cpus: 2
    environment:
      CODE_MCP_FILE_SOURCE_URL: http://app:8100/internal/files
      MCP_INTERNAL_TOKEN: ${MCP_INTERNAL_TOKEN:-}
    networks: [sandbox]

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ragdb
    # Host access for local tools (psql, a DB GUI) only — bound to localhost.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - agenticapp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raguser -d ragdb"]
      interval: 2s
      timeout: 5s
      retries: 20

  # --- optional: public entrance (profiles) ---------------------------------

  # Caddy: serves the built frontend at / and proxies /api to the API (never
  # /internal). With SITE_ADDRESS set to a domain pointing at this machine,
  # Caddy gets an HTTPS certificate automatically. Builds the frontend from
  # FRONTEND_DIR (default ../agenticapp-frontend).
  web:
    profiles: [edge, tunnel]
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      additional_contexts:
        frontend: ${FRONTEND_DIR:-../agenticapp-frontend}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
      - "${WEB_HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
    depends_on: [app]

  # A named Cloudflare tunnel to `web` — for running on your PC without
  # opening ports. Create the tunnel in the Cloudflare dashboard with its
  # public hostname pointing at http://web:80, put its token in
  # CLOUDFLARE_TUNNEL_TOKEN (root .env).
  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:2025.9.1
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [web]

networks:
  # internal: no route to the outside world. Only `app` and `code-sandbox`.
  sandbox:
    internal: true

volumes:
  agenticapp_pgdata:
  caddy_data:
