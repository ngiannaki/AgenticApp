# Local/single-host way to run the whole stack with one command:
#   docker compose up --build
#
# This is the Docker alternative to start_mcp_servers.ps1 — see RUNNING.md
# for how the two compare. It reuses backend/.env for every setting (API
# keys, model names, feature flags, ...) except the database URLs, which must
# point at this compose network's `postgres` service instead of localhost and
# are overridden below.
#
# One database: Postgres with pgvector holds users, chats, the document
# registry, the vector index and each user's private DB-tool tables.
# Passwords come from the root .env (POSTGRES_PASSWORD, AGENT_DB_PASSWORD) —
# the defaults below are for local use only.
services:
  app:
    build: .
    ports:
      - "8100:8100"
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql://raguser:${POSTGRES_PASSWORD:-changeme}@postgres:5432/ragdb
      DATABASE_AGENT_ROLE_PASSWORD: ${AGENT_DB_PASSWORD:-changeme-agent}
      DB_MCP_DATABASE_URL: postgresql://agent_ws:${AGENT_DB_PASSWORD:-changeme-agent}@postgres:5432/ragdb
      AGENTS_URL: http://agents:9100
    depends_on:
      postgres:
        condition: service_healthy
      code-sandbox:
        condition: service_started
    networks:
      - default
      - sandbox
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      # Bind-mounts the actual source over the image's baked-in COPY, so
      # edits on the host are visible inside the container immediately —
      # no rebuild needed. No auto-reload though: run
      # `docker compose restart app` yourself when you want the running
      # process to pick up the new code. The Dockerfile's CMD (used for
      # real deploys, not this compose file) is untouched and still bakes
      # the code in instead.
      - ./backend:/app/backend

  # The A2A agents (Deep Research, Data Analyst, ...). Same image as `app`;
  # reaches tools only through the API (/internal/tools), with
  # AGENTS_INTERNAL_TOKEN from backend/.env.
  agents:
    build: .
    command: ["python", "-m", "backend.apps.agents.main"]
    env_file:
      - backend/.env
    environment:
      AGENTS_HOST: 0.0.0.0
      AGENTS_URL: http://agents:9100
      AGENTS_API_URL: http://app:8100
    volumes:
      - ./backend:/app/backend

  # Runs the code the assistant writes (run_python_code, spreadsheet
  # analysis). Locked down: no secrets, read-only filesystem, minimal
  # capabilities, resource limits, and on the `sandbox` network only — it
  # can reach the API (to fetch an attached spreadsheet with a one-time
  # token) but not Postgres or the internet. Each submission runs as its own
  # unprivileged uid inside (backend/mcp_servers/code/execution/sandbox.py).
  code-sandbox:
    build:
      context: .
      dockerfile: docker/sandbox/Dockerfile
    init: true
    read_only: true
    tmpfs:
      - /work:size=1g,mode=0711
      - /tmp:size=256m
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - KILL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    pids_limit: 256
    cpus: 2
    environment:
      CODE_MCP_FILE_SOURCE_URL: http://app:8100/internal/files
    networks:
      - sandbox

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ragdb
    # Host access for local tools (psql, a DB GUI) only — bound to localhost.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - agenticapp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raguser -d ragdb"]
      interval: 2s
      timeout: 5s
      retries: 20

networks:
  # internal: no route to the outside world. Only `app` and `code-sandbox`
  # are on it.
  sandbox:
    internal: true

volumes:
  agenticapp_pgdata:
